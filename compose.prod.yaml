name: intranet-crt01-prod

services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${PORTA_HTTP:-8080}:80"
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    networks: [intranet]

  backend:
    build:
      context: ./backend
      target: producao
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: "${APP_SECRET:?Defina APP_SECRET no arquivo de ambiente de produção}"
      SYMFONY_TRUSTED_PROXIES: "127.0.0.1,REMOTE_ADDR"
      DATABASE_URL: "postgresql://${BANCO_USUARIO:?}:${BANCO_SENHA:?}@postgres:5432/${BANCO_NOME:?}?serverVersion=16&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "redis://:${REDIS_SENHA:?}@redis:6379/mensagens"
    volumes:
      - uploads_backend:/aplicacao/var/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t && pgrep php-fpm >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks: [intranet]

  trabalhador:
    build:
      context: ./backend
      target: producao
    command: ["php", "bin/console", "messenger:consume", "assincrono", "--time-limit=3600", "--memory-limit=256M"]
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: "${APP_SECRET:?Defina APP_SECRET no arquivo de ambiente de produção}"
      SYMFONY_TRUSTED_PROXIES: "127.0.0.1,REMOTE_ADDR"
      DATABASE_URL: "postgresql://${BANCO_USUARIO:?}:${BANCO_SENHA:?}@postgres:5432/${BANCO_NOME:?}?serverVersion=16&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "redis://:${REDIS_SENHA:?}@redis:6379/mensagens"
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [intranet]

  frontend:
    build:
      context: ./frontend
      target: producao
    restart: unless-stopped
    networks: [intranet]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${BANCO_NOME:?Defina BANCO_NOME}"
      POSTGRES_USER: "${BANCO_USUARIO:?Defina BANCO_USUARIO}"
      POSTGRES_PASSWORD: "${BANCO_SENHA:?Defina BANCO_SENHA}"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BANCO_USUARIO} -d ${BANCO_NOME}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [intranet]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_SENHA:?Defina REDIS_SENHA}"]
    volumes:
      - dados_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_SENHA}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [intranet]

networks:
  intranet:
    driver: bridge

volumes:
  dados_postgres:
  dados_redis:
  uploads_backend:
